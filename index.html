<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Especial de Jogos 💝</title>
    <style>
        body {
            background-color: #fdf2f8 !important;

            font-family: 'Arial', sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;

        }
        .container { text-align: center; width: 90%; max-width: 400px; }
        h1 { font-size: 28px; color: #9d174d; margin-bottom: 40px; font-weight: bold; }

            display: block; width: 100%; padding: 18px; margin: 15px 0;

            border-radius: 12px; border: none; cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1); text-align: center;
            box-sizing: border-box;
        }
        .btn-amor { background-color: #f472b6; color: white !important; }
        .btn-gym { background-color: #22c55e; color: white !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Escolha o seu Jogo, meu amor! 💖</h1>
        <a href="amor.html" class="btn btn-amor">💝 Jogo do Amor (Surpresa)</a>
        <a href="academia.html" class="btn btn-gym">🏋️ Stickman Gym Simulator</a>
